version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jwg-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jwg-network

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: jwg-hapi
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      HAPI_FHIR_LOGGING_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - jwg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  facade:
    build:
      context: ..
      dockerfile: services/facade/Dockerfile
    container_name: jwg-facade
    environment:
      HAPI_BASE_URL: http://hapi-fhir:8080/fhir
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ../config:/app/config:ro
      - ../examples:/app/examples:ro
    depends_on:
      hapi-fhir:
        condition: service_healthy
    networks:
      - jwg-network
    ports:
      - "127.0.0.1:8082:8000"

  demo-ui:
    build:
      context: ..
      dockerfile: services/demo-ui/Dockerfile
    container_name: jwg-demo-ui
    volumes:
      - ../services/demo-ui:/usr/share/nginx/html:ro
    networks:
      - jwg-network
    ports:
      - "127.0.0.1:8083:80"

  proxy:
    image: traefik:v2.10
    container_name: jwg-proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - facade
      - demo-ui
    networks:
      - jwg-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fhir.rule=Host(`fhir.local`) || Host(`localhost`) && PathPrefix(`/fhir`)"
      - "traefik.http.routers.fhir.entrypoints=web"
      - "traefik.http.services.fhir.loadbalancer.server.port=8000"
      - "traefik.http.routers.demo.rule=Host(`demo.local`) || Host(`localhost`) && PathPrefix(`/demo`)"
      - "traefik.http.routers.demo.entrypoints=web"
      - "traefik.http.services.demo.loadbalancer.server.port=80"

  seed:
    build:
      context: ..
      dockerfile: services/seed/Dockerfile
    container_name: jwg-seed
    environment:
      HAPI_BASE_URL: http://hapi-fhir:8080/fhir
    volumes:
      - ../examples:/app/examples:ro
    depends_on:
      hapi-fhir:
        condition: service_healthy
    networks:
      - jwg-network
    profiles:
      - seed

networks:
  jwg-network:
    driver: bridge

volumes:
  postgres_data:
